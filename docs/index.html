<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Interactive vocabulary learning website. Explore 100 topic groups with 4,200+ exam English words organized by level through an interactive graph.">
  <title>English Vocabulary Graph — Explore 4,200+ Words by Topic</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
</head>

<body>
  <!-- Top-left corner: Original purpose link -->
  <a href="../web/index.html" class="origin-link" id="origin-link" title="Root Word Explorer">
    <span class="origin-icon">🔤</span>
    <span class="origin-text">Root Word Explorer</span>
  </a>

  <!-- Top Navigation Breadcrumb (Path display: Vocabulary › Domain › Topic) -->
  <div class="breadcrumb-bar" id="breadcrumb-bar">
    <button class="breadcrumb-item current" id="bc-root" onclick="goToRoot()">Vocabulary</button>
  </div>

  <!-- Back to Graph button (top-right, shown when inside group view) -->
  <button class="back-btn" id="back-btn" style="display: none;" onclick="showGraph()">
    <span class="back-arrow">←</span>
    <span>Back to Graph</span>
  </button>

  <!-- Top-right: Affix Search Button -->
  <button class="nav-search-btn" id="nav-search-btn" onclick="openAffixSearchModal()"
    title="Search by Prefix / Postfix / POS">
    <span>🔍 構詞複合搜尋</span>
  </button>

  <!-- Top-right (2nd row): Next-word prediction -->
  <button class="nav-search-btn nav-predict-btn" id="nav-predict-btn" onclick="openPredictModal()"
    title="Next-word prediction">
    <span>✨ 下一字預測</span>
  </button>

  <!-- Graph View -->
  <div id="graph-view" class="view active">
    <div id="cy-container">
      <div id="cy"></div>
    </div>
    <!-- Graph controls -->
    <div class="graph-controls" id="graph-controls">
      <button class="ctrl-btn" onclick="zoomIn()" title="Zoom In">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
      <button class="ctrl-btn" onclick="zoomOut()" title="Zoom Out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
      <button class="ctrl-btn" onclick="resetView()" title="Reset View">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
      </button>
    </div>
    <!-- Loading overlay -->
    <div id="graph-loading" class="loading-overlay">
      <div class="loader-ring"></div>
      <p class="loader-text">Loading vocabulary graph…</p>
    </div>
    <!-- Error overlay -->
    <div id="graph-error" class="error-overlay" style="display:none;">
      <span class="error-icon">⚠️</span>
      <p class="error-text" id="error-text">Failed to load graph data.</p>
      <button class="retry-btn" onclick="initGraph()">Retry</button>
    </div>
  </div>

  <!-- Group Detail View (shows 6 levels) -->
  <div id="group-view" class="view">
    <div class="group-container" id="group-container">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Definition Popup / Modal -->
  <div class="def-overlay" id="def-overlay" onclick="closeDefinition()"></div>
  <div class="def-popup" id="def-popup">
    <button class="def-close" onclick="closeDefinition()">&times;</button>
    <h2 class="def-word" id="def-word"></h2>
    <div class="def-meta" id="def-meta"></div>
    <div class="def-image-container" id="def-image-container" style="display:none;">
      <img id="def-image" class="def-image" alt="" />
    </div>
    <div class="def-content" id="def-content"></div>
  </div>

  <!-- Compound Affix Search Modal -->
  <div class="search-overlay" id="search-overlay" onclick="closeAffixSearchModal()"></div>
  <div class="search-modal" id="search-modal">
    <div class="search-modal-header">
      <div class="search-modal-title">
        <span class="search-modal-icon">🔍</span>
        <h3>字首 / 字尾 / 詞性 複合查詢器 (Affix Search)</h3>
      </div>
      <button class="search-close" onclick="closeAffixSearchModal()">&times;</button>
    </div>
    <div class="search-modal-body">
      <div class="search-inputs">
        <div class="search-field">
          <label>字首 (Prefix):</label>
          <input type="text" id="search-prefix" placeholder="例: com*, pre*, un*" oninput="triggerAffixSearch()" />
        </div>
        <div class="search-field">
          <label>字尾 (Postfix):</label>
          <input type="text" id="search-postfix" placeholder="例: *te, *tion, *able" oninput="triggerAffixSearch()" />
        </div>
        <div class="search-field">
          <label>詞性 (POS):</label>
          <select id="search-pos" onchange="triggerAffixSearch()">
            <option value="">全部詞性 (All)</option>
            <option value="verb">動詞 (Verb)</option>
            <option value="noun">名詞 (Noun)</option>
            <option value="adj">形容詞 (Adjective)</option>
            <option value="adv">副詞 (Adverb)</option>
          </select>
        </div>
      </div>
      <div class="search-status" id="search-status">輸入條件即時檢索 4,842 個單字... (例: Prefix: com* + POS: verb)</div>
      <div class="search-results-grid" id="search-results-grid"></div>
    </div>
  </div>

  <!-- Next-Word Prediction Modal -->
  <div class="search-overlay" id="predict-overlay" onclick="closePredictModal()"></div>
  <div class="search-modal predict-modal" id="predict-modal">
    <div class="search-modal-header">
      <div class="search-modal-title">
        <span class="search-modal-icon">✨</span>
        <h3>下一個單字預測 (Next-Word Prediction)</h3>
      </div>
      <button class="search-close" onclick="closePredictModal()">&times;</button>
    </div>
    <div class="search-modal-body">
      <div class="predict-input-row">
        <input type="text" id="predict-input" placeholder="開始打英文句子，或直接點下面的字…" autocomplete="off" spellcheck="false" />
        <button class="predict-clear" onclick="clearPredictInput()">清除</button>
      </div>
      <div class="search-status" id="predict-context"></div>
      <div class="predict-results" id="predict-results"></div>
      <div class="predict-footnote">
        點選單字會接到句子後面；在單字上按右鍵可以打開解釋。機率來自約 200 萬句
        <a href="https://tatoeba.org" target="_blank" rel="noopener">Tatoeba</a> 英文例句
        (看前 2 個字；例句不夠時改看前 1 個字)。
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script src="./predict.js"></script>
</body>

</html>
