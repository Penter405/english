<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive vocabulary learning website. Explore 100 topic groups with 5,000 English words organized by difficulty through an interactive graph.">
  <title>English Vocabulary Graph — Explore 5,000 Words by Topic</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
</head>
<body>
  <!-- Top-left corner: Original purpose link -->
  <a href="../web/index.html" class="origin-link" id="origin-link" title="Root Word Explorer">
    <span class="origin-icon">🔤</span>
    <span class="origin-text">Root Word Explorer</span>
  </a>

  <!-- Back to Graph button (top-right, hidden by default) -->
  <button class="back-btn" id="back-btn" style="display: none;" onclick="showGraph()">
    <span class="back-arrow">←</span>
    <span>Back to Graph</span>
  </button>

  <!-- Graph View -->
  <div id="graph-view" class="view active">
    <div id="cy-container">
      <div id="cy"></div>
    </div>
    <!-- Graph controls -->
    <div class="graph-controls" id="graph-controls">
      <button class="ctrl-btn" onclick="zoomIn()" title="Zoom In">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="ctrl-btn" onclick="zoomOut()" title="Zoom Out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="ctrl-btn" onclick="resetView()" title="Reset View">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
    <!-- Loading overlay -->
    <div id="graph-loading" class="loading-overlay">
      <div class="loader-ring"></div>
      <p class="loader-text">Loading vocabulary graph…</p>
    </div>
    <!-- Error overlay -->
    <div id="graph-error" class="error-overlay" style="display:none;">
      <span class="error-icon">⚠️</span>
      <p class="error-text" id="error-text">Failed to load graph data.</p>
      <button class="retry-btn" onclick="initGraph()">Retry</button>
    </div>
  </div>

  <!-- Group Detail View -->
  <div id="group-view" class="view">
    <div class="group-container" id="group-container">
      <!-- Populated by JS -->
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
